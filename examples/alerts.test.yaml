---
rule_files:
  - alerts.yaml

evaluation_interval: 1m

tests:
  - name: an overdue key fires while its reads fail
    interval: 5m
    input_series:
      - series: openbao_rotation_key_due_timestamp_seconds{key="app/db"}
        values: 600x12
      - series: openbao_rotation_key_up{key="app/db"}
        values: 1 1 1 0x9
      - series: openbao_rotation_last_success_timestamp_seconds
        values: 0+300x12
      - series: up{job="openbao-rotation-exporter"}
        values: 1x12
    alert_rule_test:
      - eval_time: 20m
        alertname: OpenBaoRotationDue
      - eval_time: 30m
        alertname: OpenBaoRotationDue
        exp_alerts:
          - exp_labels:
              severity: warning
              key: app/db
            exp_annotations:
              summary: OpenBao key app/db is due for rotation
      - eval_time: 40m
        alertname: OpenBaoRotationKeyFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              key: app/db
            exp_annotations:
              summary: Cannot read rotation metadata for OpenBao key app/db

  - name: a key that is not due stays quiet
    interval: 5m
    input_series:
      - series: openbao_rotation_key_due_timestamp_seconds{key="app/db"}
        values: 86400x12
      - series: openbao_rotation_key_up{key="app/db"}
        values: 1x12
      - series: openbao_rotation_last_success_timestamp_seconds
        values: 0+300x12
      - series: up{job="openbao-rotation-exporter"}
        values: 1x12
    alert_rule_test:
      - eval_time: 60m
        alertname: OpenBaoRotationDue
      - eval_time: 60m
        alertname: OpenBaoRotationKeyFailing
      - eval_time: 60m
        alertname: OpenBaoRotationCollectionStale
      - eval_time: 60m
        alertname: OpenBaoRotationExporterDown

  - name: an outage keeps the due alert and adds the stale alert, without reporting the exporter as down
    interval: 5m
    input_series:
      - series: openbao_rotation_key_due_timestamp_seconds{key="app/db"}
        values: 600x24
      - series: openbao_rotation_key_up{key="app/db"}
        values: 1x24
      - series: openbao_rotation_last_success_timestamp_seconds
        values: 300x24
      - series: up{job="openbao-rotation-exporter"}
        values: 1x24
    alert_rule_test:
      - eval_time: 60m
        alertname: OpenBaoRotationDue
        exp_alerts:
          - exp_labels:
              severity: warning
              key: app/db
            exp_annotations:
              summary: OpenBao key app/db is due for rotation
      - eval_time: 60m
        alertname: OpenBaoRotationCollectionStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: OpenBao rotation metadata has not been collected for 30 minutes
      - eval_time: 60m
        alertname: OpenBaoRotationExporterDown

  - name: a restart during an outage reports stale collection straight away
    interval: 5m
    input_series:
      - series: openbao_rotation_key_up{key="app/db"}
        values: 0x12
      - series: openbao_rotation_last_success_timestamp_seconds
        values: 0x12
      - series: up{job="openbao-rotation-exporter"}
        values: 1x12
    alert_rule_test:
      - eval_time: 40m
        alertname: OpenBaoRotationCollectionStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: OpenBao rotation metadata has not been collected for 30 minutes
      - eval_time: 40m
        alertname: OpenBaoRotationKeyFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              key: app/db
            exp_annotations:
              summary: Cannot read rotation metadata for OpenBao key app/db

  - name: an unscrapeable exporter is reported as down
    interval: 5m
    input_series:
      - series: up{job="openbao-rotation-exporter"}
        values: 0x12
    alert_rule_test:
      - eval_time: 30m
        alertname: OpenBaoRotationExporterDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openbao-rotation-exporter
            exp_annotations:
              summary: The OpenBao rotation exporter cannot be scraped

  - name: a missing scrape target is reported as down
    interval: 5m
    input_series:
      - series: other_metric
        values: 1x12
    alert_rule_test:
      - eval_time: 30m
        alertname: OpenBaoRotationExporterDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openbao-rotation-exporter
            exp_annotations:
              summary: The OpenBao rotation exporter cannot be scraped
