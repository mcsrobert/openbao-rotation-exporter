---
default_install_hook_types: ["pre-commit", "commit-msg"]
default_language_version:
  node: lts
exclude: ^(CHANGELOG\.md|\.release-please-manifest\.json)$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending

  - repo: https://github.com/sirosen/texthooks
    rev: 1.0.0
    hooks:
      - id: fix-smartquotes
      - id: fix-spaces
      - id: fix-unicode-dashes

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.173.1
    hooks:
      - id: renovate-config-validator
        files: "renovate\\.json5?$"

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run ./...
        language: system
        files: \.go$
        pass_filenames: false

      - id: zizmor
        name: zizmor
        entry: zizmor --offline
        language: system
        files: ^\.github/workflows/.+\.ya?ml$

      - id: conventional-commit
        name: conventional commit with scope
        entry: '\A(Merge |Revert "|(fixup|squash)! |(feat|fix|docs|style|refactor|perf|test|build|ci|chore)(!?\([A-Za-z0-9._/-]+\)!?): \S)'
        language: pygrep
        args: ["--multiline", "--negate"]
        stages: ["commit-msg"]
