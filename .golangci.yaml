---
version: "2"
run:
  build-tags:
    - integration
linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace
  settings:
    gosec:
      excludes:
        - G304
        - G704
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - gosec
          - noctx
          - revive
          - unparam
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mcsrobert/openbao-rotation-exporter
