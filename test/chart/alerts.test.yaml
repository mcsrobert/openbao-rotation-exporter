---
rule_files:
  - alerts.yaml

evaluation_interval: 1m

tests:
  - name: an overdue key fires while its reads fail
    interval: 5m
    input_series:
      - series: openbao_rotation_key_due_timestamp_seconds{job="openbao-rotation-exporter",namespace="rotation",key="app/db"}
        values: 600x12
      - series: openbao_rotation_key_up{job="openbao-rotation-exporter",namespace="rotation",key="app/db"}
        values: 1 1 1 0x9
      - series: openbao_rotation_last_success_timestamp_seconds{job="openbao-rotation-exporter",namespace="rotation"}
        values: 0+300x12
      - series: openbao_rotation_collection_interval_seconds{job="openbao-rotation-exporter",namespace="rotation"}
        values: 300x12
      - series: up{job="openbao-rotation-exporter",namespace="rotation"}
        values: 1x12
    alert_rule_test:
      - eval_time: 20m
        alertname: OpenBaoRotationDue
      - eval_time: 30m
        alertname: OpenBaoRotationDue
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openbao-rotation-exporter
              namespace: rotation
              key: app/db
            exp_annotations:
              summary: OpenBao key app/db is due for rotation
              description: The current version passed its rotation interval on 1970-01-01 00:10:00 +0000 UTC. Rotate the credential and write the new value to OpenBao.
      - eval_time: 40m
        alertname: OpenBaoRotationKeyFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openbao-rotation-exporter
              namespace: rotation
              key: app/db
            exp_annotations:
              summary: Cannot read rotation metadata for OpenBao key app/db
              description: Check that the key exists and that the exporter's policy can read its metadata. openbao_rotation_key_failures_total has the reason.

  - name: a pod rollout keeps one overdue alert firing
    interval: 5m
    input_series:
      - series: openbao_rotation_key_due_timestamp_seconds{job="openbao-rotation-exporter",namespace="rotation",key="app/db",pod="old",instance="10.0.0.1:8080"}
        values: 600x6 _x6
      - series: openbao_rotation_key_due_timestamp_seconds{job="openbao-rotation-exporter",namespace="rotation",key="app/db",pod="new",instance="10.0.0.2:8080"}
        values: _x5 600x7
    alert_rule_test:
      - eval_time: 28m
        alertname: OpenBaoRotationDue
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openbao-rotation-exporter
              namespace: rotation
              key: app/db
            exp_annotations:
              summary: OpenBao key app/db is due for rotation
              description: The current version passed its rotation interval on 1970-01-01 00:10:00 +0000 UTC. Rotate the credential and write the new value to OpenBao.
      - eval_time: 36m
        alertname: OpenBaoRotationDue
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openbao-rotation-exporter
              namespace: rotation
              key: app/db
            exp_annotations:
              summary: OpenBao key app/db is due for rotation
              description: The current version passed its rotation interval on 1970-01-01 00:10:00 +0000 UTC. Rotate the credential and write the new value to OpenBao.

  - name: a pod rollout keeps one failing key alert firing
    interval: 5m
    input_series:
      - series: openbao_rotation_key_up{job="openbao-rotation-exporter",namespace="rotation",key="app/db",pod="old",instance="10.0.0.1:8080"}
        values: 0x6 _x6
      - series: openbao_rotation_key_up{job="openbao-rotation-exporter",namespace="rotation",key="app/db",pod="new",instance="10.0.0.2:8080"}
        values: _x5 0x7
    alert_rule_test:
      - eval_time: 28m
        alertname: OpenBaoRotationKeyFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openbao-rotation-exporter
              namespace: rotation
              key: app/db
            exp_annotations:
              summary: Cannot read rotation metadata for OpenBao key app/db
              description: Check that the key exists and that the exporter's policy can read its metadata. openbao_rotation_key_failures_total has the reason.
      - eval_time: 36m
        alertname: OpenBaoRotationKeyFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openbao-rotation-exporter
              namespace: rotation
              key: app/db
            exp_annotations:
              summary: Cannot read rotation metadata for OpenBao key app/db
              description: Check that the key exists and that the exporter's policy can read its metadata. openbao_rotation_key_failures_total has the reason.

  - name: during a rollout the newest due time wins and one readable pod keeps the key healthy
    interval: 5m
    input_series:
      - series: openbao_rotation_key_due_timestamp_seconds{job="openbao-rotation-exporter",namespace="rotation",key="app/db",pod="old",instance="10.0.0.1:8080"}
        values: 600x12
      - series: openbao_rotation_key_due_timestamp_seconds{job="openbao-rotation-exporter",namespace="rotation",key="app/db",pod="new",instance="10.0.0.2:8080"}
        values: 86400x12
      - series: openbao_rotation_key_up{job="openbao-rotation-exporter",namespace="rotation",key="app/db",pod="old",instance="10.0.0.1:8080"}
        values: 1x12
      - series: openbao_rotation_key_up{job="openbao-rotation-exporter",namespace="rotation",key="app/db",pod="new",instance="10.0.0.2:8080"}
        values: 0x12
    alert_rule_test:
      - eval_time: 40m
        alertname: OpenBaoRotationDue
      - eval_time: 40m
        alertname: OpenBaoRotationKeyFailing

  - name: a key that is not due stays quiet
    interval: 5m
    input_series:
      - series: openbao_rotation_key_due_timestamp_seconds{job="openbao-rotation-exporter",namespace="rotation",key="app/db"}
        values: 86400x12
      - series: openbao_rotation_key_up{job="openbao-rotation-exporter",namespace="rotation",key="app/db"}
        values: 1x12
      - series: openbao_rotation_last_success_timestamp_seconds{job="openbao-rotation-exporter",namespace="rotation"}
        values: 0+300x12
      - series: openbao_rotation_collection_interval_seconds{job="openbao-rotation-exporter",namespace="rotation"}
        values: 300x12
      - series: up{job="openbao-rotation-exporter",namespace="rotation"}
        values: 1x12
    alert_rule_test:
      - eval_time: 60m
        alertname: OpenBaoRotationDue
      - eval_time: 60m
        alertname: OpenBaoRotationKeyFailing
      - eval_time: 60m
        alertname: OpenBaoRotationCollectionStale
  - name: an outage keeps the due alert and adds the stale alert, without reporting the exporter as down
    interval: 5m
    input_series:
      - series: openbao_rotation_key_due_timestamp_seconds{job="openbao-rotation-exporter",namespace="rotation",key="app/db"}
        values: 600x24
      - series: openbao_rotation_key_up{job="openbao-rotation-exporter",namespace="rotation",key="app/db"}
        values: 1x24
      - series: openbao_rotation_last_success_timestamp_seconds{job="openbao-rotation-exporter",namespace="rotation"}
        values: 300x24
      - series: openbao_rotation_collection_interval_seconds{job="openbao-rotation-exporter",namespace="rotation"}
        values: 300x24
      - series: up{job="openbao-rotation-exporter",namespace="rotation"}
        values: 1x24
    alert_rule_test:
      - eval_time: 60m
        alertname: OpenBaoRotationDue
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openbao-rotation-exporter
              namespace: rotation
              key: app/db
            exp_annotations:
              summary: OpenBao key app/db is due for rotation
              description: The current version passed its rotation interval on 1970-01-01 00:10:00 +0000 UTC. Rotate the credential and write the new value to OpenBao.
      - eval_time: 60m
        alertname: OpenBaoRotationCollectionStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openbao-rotation-exporter
              namespace: rotation
            exp_annotations:
              summary: OpenBao rotation metadata is stale
              description: No collection has succeeded for three collection intervals, and at least 30 minutes. Due times may be out of date. Check OpenBao, the exporter's login and the exporter logs.
  - name: a restart during an outage waits the full stale threshold
    interval: 5m
    input_series:
      - series: process_start_time_seconds{job="openbao-rotation-exporter",namespace="rotation"}
        values: 0x12
      - series: openbao_rotation_last_success_timestamp_seconds{job="openbao-rotation-exporter",namespace="rotation"}
        values: 0x12
      - series: openbao_rotation_collection_interval_seconds{job="openbao-rotation-exporter",namespace="rotation"}
        values: 300x12
      - series: up{job="openbao-rotation-exporter",namespace="rotation"}
        values: 1x12
    alert_rule_test:
      - eval_time: 10m
        alertname: OpenBaoRotationCollectionStale
      - eval_time: 30m
        alertname: OpenBaoRotationCollectionStale
      - eval_time: 40m
        alertname: OpenBaoRotationCollectionStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openbao-rotation-exporter
              namespace: rotation
            exp_annotations:
              summary: OpenBao rotation metadata is stale
              description: No collection has succeeded for three collection intervals, and at least 30 minutes. Due times may be out of date. Check OpenBao, the exporter's login and the exporter logs.
      - eval_time: 40m
        alertname: OpenBaoRotationKeyFailing

  - name: a long interval with healthy collections and one failed collection is not stale
    interval: 5m
    input_series:
      - series: openbao_rotation_last_success_timestamp_seconds{job="openbao-rotation-exporter",namespace="rotation"}
        values: 60x11 3660x11 7260x23 14460x11 18060x11
      - series: openbao_rotation_collection_interval_seconds{job="openbao-rotation-exporter",namespace="rotation"}
        values: 3600x71
    alert_rule_test:
      - eval_time: 55m
        alertname: OpenBaoRotationCollectionStale
      - eval_time: 115m
        alertname: OpenBaoRotationCollectionStale
      - eval_time: 175m
        alertname: OpenBaoRotationCollectionStale
      - eval_time: 239m
        alertname: OpenBaoRotationCollectionStale
      - eval_time: 355m
        alertname: OpenBaoRotationCollectionStale

  - name: a long interval reports stale collection after three intervals
    interval: 5m
    input_series:
      - series: openbao_rotation_last_success_timestamp_seconds{job="openbao-rotation-exporter",namespace="rotation"}
        values: 60x40
      - series: openbao_rotation_collection_interval_seconds{job="openbao-rotation-exporter",namespace="rotation"}
        values: 3600x40
    alert_rule_test:
      - eval_time: 185m
        alertname: OpenBaoRotationCollectionStale
      - eval_time: 190m
        alertname: OpenBaoRotationCollectionStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openbao-rotation-exporter
              namespace: rotation
            exp_annotations:
              summary: OpenBao rotation metadata is stale
              description: No collection has succeeded for three collection intervals, and at least 30 minutes. Due times may be out of date. Check OpenBao, the exporter's login and the exporter logs.

  - name: a restart during an outage with a long interval waits three intervals
    interval: 5m
    input_series:
      - series: process_start_time_seconds{job="openbao-rotation-exporter",namespace="rotation"}
        values: 0x40
      - series: openbao_rotation_last_success_timestamp_seconds{job="openbao-rotation-exporter",namespace="rotation"}
        values: 0x40
      - series: openbao_rotation_collection_interval_seconds{job="openbao-rotation-exporter",namespace="rotation"}
        values: 3600x40
    alert_rule_test:
      - eval_time: 10m
        alertname: OpenBaoRotationCollectionStale
      - eval_time: 180m
        alertname: OpenBaoRotationCollectionStale
      - eval_time: 190m
        alertname: OpenBaoRotationCollectionStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openbao-rotation-exporter
              namespace: rotation
            exp_annotations:
              summary: OpenBao rotation metadata is stale
              description: No collection has succeeded for three collection intervals, and at least 30 minutes. Due times may be out of date. Check OpenBao, the exporter's login and the exporter logs.

  - name: the default interval reports stale collection after 30 minutes
    interval: 5m
    input_series:
      - series: openbao_rotation_last_success_timestamp_seconds{job="openbao-rotation-exporter",namespace="rotation"}
        values: 60x12
      - series: openbao_rotation_collection_interval_seconds{job="openbao-rotation-exporter",namespace="rotation"}
        values: 300x12
    alert_rule_test:
      - eval_time: 35m
        alertname: OpenBaoRotationCollectionStale
      - eval_time: 40m
        alertname: OpenBaoRotationCollectionStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openbao-rotation-exporter
              namespace: rotation
            exp_annotations:
              summary: OpenBao rotation metadata is stale
              description: No collection has succeeded for three collection intervals, and at least 30 minutes. Due times may be out of date. Check OpenBao, the exporter's login and the exporter logs.

  - name: an exporter without the interval metric reports stale collection after 30 minutes
    interval: 5m
    input_series:
      - series: openbao_rotation_last_success_timestamp_seconds{job="openbao-rotation-exporter",namespace="rotation"}
        values: 60x12
    alert_rule_test:
      - eval_time: 35m
        alertname: OpenBaoRotationCollectionStale
      - eval_time: 40m
        alertname: OpenBaoRotationCollectionStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openbao-rotation-exporter
              namespace: rotation
            exp_annotations:
              summary: OpenBao rotation metadata is stale
              description: No collection has succeeded for three collection intervals, and at least 30 minutes. Due times may be out of date. Check OpenBao, the exporter's login and the exporter logs.

  - name: a new process gets a full stale grace period
    interval: 5m
    input_series:
      - series: openbao_rotation_last_success_timestamp_seconds{job="openbao-rotation-exporter",namespace="rotation",pod="a",instance="10.0.0.1:8080"}
        values: 60x7
      - series: openbao_rotation_collection_interval_seconds{job="openbao-rotation-exporter",namespace="rotation",pod="a",instance="10.0.0.1:8080"}
        values: 300x7
      - series: openbao_rotation_last_success_timestamp_seconds{job="openbao-rotation-exporter",namespace="rotation",pod="b",instance="10.0.0.2:8080"}
        values: _x6 0x6
      - series: openbao_rotation_collection_interval_seconds{job="openbao-rotation-exporter",namespace="rotation",pod="b",instance="10.0.0.2:8080"}
        values: _x6 300x6
    alert_rule_test:
      - eval_time: 38m
        alertname: OpenBaoRotationCollectionStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openbao-rotation-exporter
              namespace: rotation
            exp_annotations:
              summary: OpenBao rotation metadata is stale
              description: No collection has succeeded for three collection intervals, and at least 30 minutes. Due times may be out of date. Check OpenBao, the exporter's login and the exporter logs.
      - eval_time: 50m
        alertname: OpenBaoRotationCollectionStale

  - name: another release's series do not fire these alerts
    interval: 5m
    input_series:
      - series: openbao_rotation_key_due_timestamp_seconds{job="other",namespace="elsewhere",key="app/db"}
        values: 600x12
      - series: openbao_rotation_key_up{job="other",namespace="elsewhere",key="app/db"}
        values: 0x12
      - series: up{job="openbao-rotation-exporter",namespace="rotation"}
        values: 1x12
    alert_rule_test:
      - eval_time: 40m
        alertname: OpenBaoRotationDue
      - eval_time: 40m
        alertname: OpenBaoRotationKeyFailing

  - name: an overdue alert clears without metadata and fires again after recovery
    interval: 1m
    input_series:
      - series: openbao_rotation_key_due_timestamp_seconds{job="openbao-rotation-exporter",namespace="rotation",key="app/db"}
        values: 600x30 stale _x28 600x30
    alert_rule_test:
      - eval_time: 50m
        alertname: OpenBaoRotationDue
      - eval_time: 80m
        alertname: OpenBaoRotationDue
        exp_alerts:
          - exp_labels:
              severity: warning
              job: openbao-rotation-exporter
              namespace: rotation
              key: app/db
            exp_annotations:
              summary: OpenBao key app/db is due for rotation
              description: The current version passed its rotation interval on 1970-01-01 00:10:00 +0000 UTC. Rotate the credential and write the new value to OpenBao.
      - eval_time: 65m
        alertname: OpenBaoRotationDue
