---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rotation
resources:
  - ./namespace.yaml
  - ../../examples/kubernetes
configMapGenerator:
  - name: openbao-rotation-exporter-config
    behavior: replace
    files:
      - ./config.yaml
images:
  - name: ghcr.io/mcsrobert/openbao-rotation-exporter
    newName: openbao-rotation-exporter
    newTag: e2e
