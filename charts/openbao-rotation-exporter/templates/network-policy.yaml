{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openbao-rotation-exporter.fullname" . }}
  labels:
    {{- include "openbao-rotation-exporter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openbao-rotation-exporter.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
      {{- with .Values.networkPolicy.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
