{{- if .Values.prometheusRule.enabled }}
{{- $fullname := include "openbao-rotation-exporter.fullname" . }}
{{- $selector := printf "job=%q,namespace=%q" $fullname .Release.Namespace }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "openbao-rotation-exporter.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ $fullname }}
      rules:
        - alert: OpenBaoRotationDue
          expr: time() > max by (job, namespace, key) (openbao_rotation_key_due_timestamp_seconds{ {{- $selector -}} })
          for: 15m
          {{- with .Values.prometheusRule.alertLabels }}
          labels:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          annotations:
            summary: OpenBao key {{ "{{" }} $labels.key {{ "}}" }} is due for rotation
            description: >-
              The current version passed its rotation interval on
              {{ "{{" }} $value | humanizeTimestamp {{ "}}" }}. Rotate the credential and write the
              new value to OpenBao.
        - alert: OpenBaoRotationKeyFailing
          expr: max by (job, namespace, key) (openbao_rotation_key_up{ {{- $selector -}} }) == 0
          for: 15m
          {{- with .Values.prometheusRule.alertLabels }}
          labels:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          annotations:
            summary: Cannot read rotation metadata for OpenBao key {{ "{{" }} $labels.key {{ "}}" }}
            description: >-
              Check that the key exists and that the exporter's policy can read its metadata.
              openbao_rotation_key_failures_total has the reason.
        - alert: OpenBaoRotationCollectionStale
          expr: |-
            time() - max by (job, namespace) (
              (openbao_rotation_last_success_timestamp_seconds{ {{- $selector -}} } > 0)
              or on (job, namespace, instance)
              process_start_time_seconds{ {{- $selector -}} }
            )
              > on (job, namespace)
            (
                clamp_min(3 * max by (job, namespace) (openbao_rotation_collection_interval_seconds{ {{- $selector -}} }), 1800)
              or
                0 * max by (job, namespace) (openbao_rotation_last_success_timestamp_seconds{ {{- $selector -}} }) + 1800
            )
          for: 5m
          {{- with .Values.prometheusRule.alertLabels }}
          labels:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          annotations:
            summary: OpenBao rotation metadata is stale
            description: >-
              No collection has succeeded for three collection intervals, and at least 30 minutes.
              Due times may be out of date. Check OpenBao, the exporter's login and the exporter
              logs.
{{- end }}
