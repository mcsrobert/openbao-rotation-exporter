min_version = "2026.10.0"

[tools]
"aqua:openbao/openbao/bao" = "2.7.2"
gitleaks = "8.30.1"
go = "1.27.3"
golangci-lint = "2.15.0"
kind = "0.33.0"
kubectl = "1.37.2"
pre-commit = "4.7.0"
promtool = "3.16.0"
zizmor = "1.32.0"

[tasks.setup]
description = "Install the git hooks"
run = "pre-commit install"

[tasks.lint]
description = "Run all linters"
run = [
  "golangci-lint run ./...",
  "pre-commit run --all-files",
  "gitleaks git --redact --no-banner",
]

[tasks.test]
description = "Run unit tests"
run = "go test -race ./..."

[tasks."test:integration"]
description = "Run tests against a real OpenBao dev server"
run = "go test -race -tags integration -count=1 ./test/integration/"

[tasks."test:rules"]
description = "Test the example alert rules"
dir = "examples"
run = "promtool test rules alerts.test.yaml"

[tasks."test:image"]
description = "Build the image and run it hardened"
run = "test/image-smoke.sh"

[tasks."test:e2e"]
description = "Run the image in kind against OpenBao with Kubernetes auth"
run = "test/e2e/run.sh"
